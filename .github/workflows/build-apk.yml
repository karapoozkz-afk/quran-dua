# Builds a debug APK on every push and pull request and attaches it to the run.
# Download it from the run's "Artifacts" section on GitHub.
name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (shared module)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: quran-dua-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      # A direct download link for phones: the "latest" release always holds the newest APK from main.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка / Latest build
          prerelease: true
          make_latest: true
          files: androidApp/build/outputs/apk/debug/*.apk
